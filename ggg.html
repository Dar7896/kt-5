<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анимированная машинка на пейзаже</title>
  <style>

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden; 
      background: #87CEEB; 
      height: 100vh;
      position: relative;
    }

 
    .grass {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 20%;
      background: #2ed573; 
    }

    .road {
      position: absolute;
      bottom: 20%;
      width: 100%;
      height: 40px;
      background: #333;
      border-top: 4px dashed #fff; 
      z-index: 1; 
    }


    .car {
      position: absolute;
      bottom: calc(20% + 20px); 
      width: 200px;            
      height: 60px;
      background: #e74c3c;      
      border-radius: 10px 30px 10px 10px;
      z-index: 2;             
      

      animation: drive 4s ease-out forwards;
    }

    .car::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 40px;
      width: 90px;
      height: 40px;
      background: #34495e; 
      border-radius: 20px 20px 0 0;
      box-shadow: 
        -20px 5px 0 -5px #fff, 
        20px 5px 0 -5px #fff;
    }

    .car::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 25px;
      width: 40px;
      height: 40px;
      background: #222;       
      border: 4px solid #fff;  
      border-radius: 50%;

      box-shadow: 
        100px 0 0 0 #222,      
        140px -40px 0 -12px #f1c40f, 
        -35px -40px 0 -14px #e67e22;
    }

    @keyframes drive {
      0% {
        left: -200px;
      }
      100% {
        left: calc(100vw - 200px - 50px);
      }
    }
  </style>
</head>
<body>

  <div class="grass"></div>
  <div class="road"></div>
  <div class="car"></div>

</body>
</html>
